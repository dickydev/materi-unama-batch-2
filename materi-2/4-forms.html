<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Materi 4 - Forms</title>
  </head>
  <body>
    <h1>Materi 4 - Forms</h1>

    <h2>1. Form Sederhana</h2>
    <form>
      <div>
        <label for="name">Name :</label>
        <input type="text" placeholder="Masukkan nama..." required />
      </div>
      <div>
        <label for="umur">Umur :</label>
        <input type="number" placeholder="Masukkan umur..." required />
      </div>
      <div>
        <label for="email">Email :</label>
        <input type="email" placeholder="Masukkan email..." required />
      </div>
      <div>
        <label for="tanggal-lahir">Tanggal Lahir :</label>
        <input type="date" placeholder="Masukkan email..." />
      </div>
      <div>
        <label for="password">Password :</label>
        <input type="password" placeholder="Masukkan password..." />
      </div>
      <div>
        <label for="pas-foto">Pas Foto :</label>
        <input type="file" />
      </div>
      <div>
        <label for="gender">Gender : </label>
        <input type="radio" name="gender" id="gender" value="l" /> Laki-laki
        <input type="radio" name="gender" id="gender" value="p" /> Perempuan
      </div>
      <div>
        <label for="hobby">Hobby : </label>
        <input type="checkbox" name="hobby" id="hobby" value="basket" /> Basket
        <input type="checkbox" name="hobby" id="hobby" value="ngoding" />
        Mengoding
      </div>
      <div>
        <label for="city">Pilih kota : </label>
        <select name="city" id="city">
          <option value="" selected disabled>Pilih kota</option>
          <option value="tng">Tangerang</option>
          <option value="jkt">Jakarta</option>
          <option value="jbi">Jambi</option>
        </select>
      </div>
      <button type="submit">Submit</button>
    </form>

    <h2>2. Form Extraordinary</h2>
    <form>
      <fieldset>
        <legend>Formulir Data Diri</legend>

        <fieldset>
          <legend>Data Wajib</legend>
          <div>
            <label for="name">Name :</label>
            <input type="text" placeholder="Masukkan nama..." required />
          </div>
          <div>
            <label for="umur">Umur :</label>
            <input type="number" placeholder="Masukkan umur..." required />
          </div>
          <div>
            <label for="email">Email :</label>
            <input type="email" placeholder="Masukkan email..." required />
          </div>
          <div>
            <label for="tanggal-lahir">Tanggal Lahir :</label>
            <input type="date" placeholder="Masukkan email..." />
          </div>
          <div>
            <label for="password">Password :</label>
            <input type="password" placeholder="Masukkan password..." />
          </div>
          <div>
            <label for="pas-foto">Pas Foto :</label>
            <input type="file" />
          </div>
          <div>
            <label for="gender">Gender : </label>
            <input type="radio" name="gender" id="gender" value="l" /> Laki-laki
            <input type="radio" name="gender" id="gender" value="p" /> Perempuan
          </div>
        </fieldset>
        <fieldset>
          <legend>Data Tidak Wajib</legend>
          <div>
            <label for="hobby">Hobby : </label>
            <input type="checkbox" name="hobby" id="hobby" value="basket" />
            Basket
            <input type="checkbox" name="hobby" id="hobby" value="ngoding" />
            Mengoding
          </div>
          <div>
            <label for="city">Pilih kota : </label>
            <select name="city" id="city">
              <option value="" selected disabled>Pilih kota</option>
              <option value="tng">Tangerang</option>
              <option value="jkt">Jakarta</option>
              <option value="jbi">Jambi</option>
            </select>
          </div>
        </fieldset>
        <button type="submit">Submit</button>
      </fieldset>
    </form>
  </body>
</html>
