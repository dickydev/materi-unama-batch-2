<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tugas 2 - Clone Apple.com</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <h1>Logo</h1>
      <nav>
        <ul>
          <li>
            <a href="">Store</a>
          </li>
          <li>
            <a href="">Mac</a>
          </li>
          <li>
            <a href="">iPad</a>
          </li>
          <li>
            <a href="">iPhone</a>
          </li>
          <li>
            <a href="">Watch</a>
          </li>
          <li>
            <a href="">Vision</a>
          </li>
          <li>
            <a href="">AirPods</a>
          </li>
          <li>
            <a href="">Tv & Home</a>
          </li>
        </ul>
      </nav>

      <div class="button">
        <button>Search</button>
        <button>Cart</button>
        <button class="hamburger">☰</button>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="text-hero">
          <h2>iPhone 18 Pro Max</h2>
          <p>Pro further.</p>
          <div class="button-hero">
            <button class="fill">Learn More</button>
            <button class="outline">Buy</button>
          </div>
        </div>
        <img src="./hero.jpg" alt="Ini adalah gambar hero section" />
      </section>
    </main>
  </body>
</html>
