<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- 2. Internal CSS = Langsung di file HTML namun berada pada tag <style></style> -->
    <style>
      h1 {
        color: green;
        text-transform: uppercase;
        font-family: Arial, Helvetica, sans-serif;
      }
    </style>

    <!-- 3. Eksternal CSS = Berada diluar file HTML, dengan ekstensi .css -->
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <h1>Judul halaman web</h1>

    <!-- 1. Inline CSS = Langsung pada Kode HTML -->
    <p style="color: red; text-decoration: underline">
      Lorem ipsum dolor sit, amet consectetur adipisicing elit. Ut, et?
    </p>

    <ul>
      <li>Makan</li>
      <li>Minum</li>
      <li>Tidur</li>
    </ul>
  </body>
</html>
