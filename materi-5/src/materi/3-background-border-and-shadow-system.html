<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Materi 3 - Backround, Border and Shadow System</title>
    <link rel="stylesheet" href="../output.css" />
  </head>
  <body>
    <h2>1. Background</h2>
    <div class="w-full h-50 bg-amber-500"></div>

    <h2>2. Border</h2>
    <div
      class="w-full h-50 bg-amber-500 border-4 border-red-500 rounded shadow-xl"
    ></div>
    <h2>3. Shadow</h2>
    <div
      class="w-full h-50 bg-amber-500 border-4 border-red-500 rounded shadow-xl shadow-pink-500"
    ></div>
    <h2>4. Background Gradient</h2>
    <div
      class="w-full h-50 bg-amber-500 border-4 border-red-500 rounded shadow-xl shadow-pink-500 bg-linear-to-r from-blue-500 to-pink-500"
    ></div>

    <!-- Contoh -->
    <div class="h-14 bg-linear-to-t from-sky-500 to-indigo-500"></div>
  </body>
</html>
