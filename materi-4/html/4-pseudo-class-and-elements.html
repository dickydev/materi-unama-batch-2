<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Materi 4 - Pseudo-class and Pseudo-elements</title>
    <link rel="stylesheet" href="../css/4-pseudo-class-and-elements.css" />
  </head>
  <body>
    <h1>Materi 4 - Pseudo-class and Pseudo-elements</h1>

    <h2>1. Pseudo-class</h2>
    <button type="button">Submit</button>
    <input type="text" />

    <h2>2. Pseudo-element</h2>
    <ul>
      <li>Makan</li>
      <li>Minum</li>
      <li>Tidur</li>
    </ul>

    <div class="example">This is an example.</div>
    <a href="#">Hover over me</a>
    <input type="text" placeholder="Focus on me" />
    <input type="password" placeholder="Password input" />
    <ul>
      <li>Item 1</li>
      <li>Item 2</li>
      <li>Item 3</li>
    </ul>
    <p>This is an example paragraph. The first line will be bold.</p>
    <button>Hover over me</button>
  </body>
</html>
